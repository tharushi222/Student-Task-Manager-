
<!DOCTYPE html>
<head>
    <name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <aside class="sidebar">
            <h2>StudyMate</h2>

            <nav>
                <a href="#dashboard" class="active">Dashboard</a>
                <a href="#tasks">My Tasks</a>
                <a href="#add-task">Add Task</a>
                <a href="#completed">Completed</a>
            </nav>
        </aside>

        <main class="main-content" id="dashboard">

            <header class="topbar">
                <div>
                    <h1>Student Dashboard</h1>
                    <p>Organize your studies, one task at a time.</p>
                </div>
            </header>

            <section class="summary-cards">
                <div class="summary-card">
                    <h3>Total Tasks</h3>
                    <p id="total-count">0</p>
                </div>

                <div class="summary-card">
                    <h3>Pending Tasks</h3>
                    <p id="pending-count">0</p>
                </div>

                <div class="summary-card">
                    <h3>Completed Tasks</h3>
                    <p id="completed-count">0</p>
                </div>
            </section>

            <section class="task-form-section" id="add-task">
                <h2>Add a New Task</h2>

                <form id="task-form">
                    <label for="task-title">Task Name</label>
                    <input
                        type="text"
                        id="task-title"
                        placeholder="e.g. Complete Python assignment"
                        required
                    >

                    <label for="task-subject">Subject</label>
                    <input
                        type="text"
                        id="task-subject"
                        placeholder="e.g. Programming"
                        required
                    >

                    <label for="task-date">Due Date</label>
                    <input type="date" id="task-date" required>

                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>

                    <button type="submit">+ Add Task</button>
                </form>
            </section>

            <section class="tasks-section" id="tasks">
                <h2>My Tasks</h2>
                <input
      type="text"
      id="search-task"
      placeholder="Search your tasks..."
      >

                <div id="task-list">
                    <p class="empty-message">No tasks yet. Add your first task!</p>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
